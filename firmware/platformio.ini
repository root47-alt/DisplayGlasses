; DisplayGlasses firmware
;
; Build and flash with PlatformIO (VS Code extension, or `pio run -e feather -t upload`).
;
;   feather       Real glasses: Adafruit ESP32-S3 Feather + OLED, paired with an iPhone.
;   feather_demo  Same board, no Bluetooth. Plays fake notifications so you can test
;                 the screen and optics before pairing.
;   feather_v2, feather_v2_demo
;                 The same two builds for the Adafruit ESP32 Feather V2, a drop-in
;                 alternative when the ESP32-S3 Feather is out of stock.
;   wokwi         Demo mode for the Wokwi simulator (see wokwi.toml / diagram.json).
;   native        Unit tests for the pure logic in lib/core (runs on your computer).

[platformio]
default_envs = feather

[common]
lib_deps =
    olikraus/U8g2@^2.36.18

[esp32]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[demo]
; Demo builds skip Bluetooth entirely.
build_src_filter = +<*> -<iphone_link.cpp>

[env:feather]
extends = esp32
board = adafruit_feather_esp32s3
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^2.5.2
build_src_filter = +<*> -<demo.cpp>

[env:feather_demo]
extends = esp32
board = adafruit_feather_esp32s3
lib_deps = ${common.lib_deps}
build_src_filter = ${demo.build_src_filter}
build_flags = -DDEMO_MODE

[env:feather_v2]
extends = esp32
board = adafruit_feather_esp32_v2
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^2.5.2
build_src_filter = +<*> -<demo.cpp>
build_flags = -DBUTTON_PIN=38

[env:feather_v2_demo]
extends = esp32
board = adafruit_feather_esp32_v2
lib_deps = ${common.lib_deps}
build_src_filter = ${demo.build_src_filter}
build_flags = -DDEMO_MODE -DBUTTON_PIN=38

[env:wokwi]
extends = esp32
board = esp32-s3-devkitc-1
lib_deps = ${common.lib_deps}
build_src_filter = ${demo.build_src_filter}
build_flags =
    -DDEMO_MODE
    -DI2C_SDA=8
    -DI2C_SCL=9
    -DBUTTON_PIN=4

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
